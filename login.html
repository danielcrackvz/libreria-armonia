<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso - Librería Armonía</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="auth.css">
</head>
<body>
    <div class="auth-wrapper">
        <div class="auth-bg">
            <div class="floating-element el-1"><i class="fas fa-pencil-alt"></i></div>
            <div class="floating-element el-2"><i class="fas fa-eraser"></i></div>
            <div class="floating-element el-3"><i class="fas fa-paint-brush"></i></div>
            <div class="floating-element el-4"><i class="fas fa-palette"></i></div>
        </div>

        <div class="auth-container">
            <div class="auth-card">
                <div class="auth-header">
                    <img src="img/logo-armonia.png" alt="Logo Librería Armonía" class="auth-logo-img">
                    <h1>Librería Armonía</h1>
                    <p>Sistema de Inventario, Compra y Venta</p>
                </div>

                <form id="loginForm" class="auth-form">
                    <div class="input-group">
                        <div class="input-icon"><i class="fas fa-user"></i></div>
                        <input type="email" id="loginUser" required placeholder="Correo electrónico">
                    </div>

                    <div class="input-group">
                        <div class="input-icon"><i class="fas fa-lock"></i></div>
                        <input type="password" id="loginPassword" required placeholder="Contraseña">
                        <button type="button" class="toggle-password" onclick="togglePassword('loginPassword', 'toggleIcon1')">
                            <i class="fas fa-eye" id="toggleIcon1"></i>
                        </button>
                    </div>

                    <div class="form-options">
                        <label class="checkbox-label">
                            <input type="checkbox" id="remember">
                            <span>Recordarme</span>
                        </label>
                    </div>

                    <button type="submit" class="btn-submit">
                        <i class="fas fa-sign-in-alt"></i>
                        <span>Iniciar Sesión</span>
                    </button>
                </form>

                <div class="auth-footer">
                    <p>¿Olvidaste tu contraseña? Contacta a la administradora</p>
                </div>
            </div>
        </div>
    </div>

    <div id="loadingOverlay" class="loading-overlay">
        <div class="spinner"></div>
        <p>Validando credenciales...</p>
    </div>

</body>
